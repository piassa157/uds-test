spring.application.name=filesmove
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/filesmove?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:filesmove}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:filesmove}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.autoconfigure.exclude=org.springframework.boot.session.autoconfigure.SessionAutoConfiguration,org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration

app.security.jwt.secret=${APP_JWT_SECRET:filesmove-super-secret-key-32-characters-min}
app.security.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.storage.local-path=${APP_STORAGE_LOCAL_PATH:/tmp/filesmove-storage}
